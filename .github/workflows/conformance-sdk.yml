name: mForm SDK conformance

# The emitted depends_on rules must evaluate identically in the mForm SDK's own interpreter
# (frappe-mobile-sdk lib/src/utils/js_expression.dart). Bump XLSFORM_SDK_REF when the SDK changes.
on:
  pull_request:
  push:
    branches: [develop, version-16]
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

env:
  XLSFORM_SDK_REF: 1058b155bc9024072fe6352c42f7030f81f20940

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d  # v1
      - run: pip install "openpyxl~=3.1.5" pytest
      - run: scripts/conformance-dart.sh python "$XLSFORM_SDK_REF"
