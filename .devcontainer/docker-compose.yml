# Local development stack for xlsform on Frappe v16.
#   docker compose -f .devcontainer/docker-compose.yml -p xlsform-dev up -d
#   docker compose -f .devcontainer/docker-compose.yml -p xlsform-dev exec frappe bash
# The bench lives in a named volume (fast on macOS); this repo is mounted at /workspace/xlsform
# and symlinked into the bench by .devcontainer/setup-bench.sh.
services:
  mariadb:
    image: docker.io/mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: docker.io/redis:alpine

  redis-queue:
    image: docker.io/redis:alpine

  frappe:
    image: docker.io/frappe/bench:latest
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
    volumes:
      - ..:/workspace/xlsform:cached
      - bench:/home/frappe/bench
    working_dir: /home/frappe/bench
    ports:
      - "8010:8000"
      - "9010:9000"

volumes:
  mariadb-data:
  bench:
